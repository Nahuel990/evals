<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Review — Senior QA</title>
<style>
  :root{
    --bg:#131a2a;
    --panel:#1b2438;
    --line:#2c3854;
    --ink:#e8ecf4;
    --muted:#8a97b3;
    --amber:#f0b429;
    --rose:#e08a8a;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    display:flex; flex-direction:column;
    padding:clamp(16px,2.5vw,40px);
    gap:clamp(12px,2vh,24px);
  }
  .rail{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .pip{height:4px; flex:1 1 10px; background:var(--line); border-radius:2px; transition:background .2s}
  .pip.done{background:#3f4d70}
  .pip.here{background:var(--amber)}
  .count{font:500 13px/1 var(--mono); color:var(--muted); margin-left:10px; white-space:nowrap}

  main{flex:1; display:flex; align-items:center; justify-content:center; min-height:0}
  .card{width:100%; max-width:1100px; display:flex; flex-direction:column; gap:clamp(10px,1.6vh,20px)}
  .eyebrow{
    display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;
    font:600 clamp(11px,1.1vw,14px)/1 var(--sans);
    letter-spacing:.14em; text-transform:uppercase; color:var(--amber);
  }
  .bugs{color:var(--muted); letter-spacing:.08em}
  h1{font:600 clamp(22px,3.4vw,42px)/1.15 var(--sans); margin:0; letter-spacing:-.015em}
  .ctx{font:400 clamp(14px,1.5vw,19px)/1.5 var(--sans); color:var(--muted); margin:0; max-width:70ch}

  pre{
    margin:0; background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:clamp(14px,2vw,28px); overflow:auto;
    font:500 clamp(14px,1.6vw,25px)/1.6 var(--mono);
    tab-size:2; white-space:pre;
  }
  .k{color:#8fb8ff} .s{color:#9fd8a8} .n{color:#e6c07b} .c{color:#5f6d8c; font-style:italic}

  .answer{
    border-left:3px solid var(--rose); padding:2px 0 2px 18px;
    font:400 clamp(14px,1.5vw,19px)/1.6 var(--sans); color:var(--ink);
  }
  .answer[hidden]{display:none}
  .answer ol{margin:0; padding-left:1.2em}
  .answer li+li{margin-top:.5em}
  .answer b{color:var(--rose); font-weight:600}
  .answer p{margin:.8em 0 0; color:var(--muted)}

  footer{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  button{
    font:600 clamp(13px,1.2vw,16px)/1 var(--sans); color:var(--ink);
    background:transparent; border:1px solid var(--line); border-radius:8px;
    padding:.85em 1.4em; cursor:pointer; transition:border-color .15s, background .15s;
  }
  button:hover:not(:disabled){border-color:#4a5a80; background:#1a2233}
  button:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
  button:disabled{opacity:.32; cursor:default}
  #reveal{border-color:var(--amber); color:var(--amber)}
  #reveal:hover{background:rgba(240,180,41,.09)}
  #next{margin-left:auto}
  .hint{font:400 12px/1 var(--mono); color:var(--muted)}

  @media (max-width:600px){ #next{margin-left:0; width:100%} footer{gap:8px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="rail" id="rail"></div>

<main>
  <div class="card">
    <div class="eyebrow"><span id="topic"></span><span class="bugs" id="bugs"></span></div>
    <h1 id="title"></h1>
    <p class="ctx" id="ctx"></p>
    <pre><code id="code"></code></pre>
    <div class="answer" id="answer" hidden></div>
  </div>
</main>

<footer>
  <button id="back">← Back</button>
  <button id="reveal">Show answer</button>
  <span class="hint">← → to move · space to reveal</span>
  <button id="next">Next →</button>
</footer>

<script>
const SLIDES = [
{
  topic:"Start", bugs:"", title:"SQL review",
  ctx:"Ten short queries. Each one has a bug — some won't run at all, some run fine and give the wrong answer. Tell me what's wrong and what you'd expect to happen.",
  sql:"-- Standard SQL. Nothing exotic.\n\n-- Ready when you are.",
  answer:null
},
{
  topic:"NULL", bugs:"1 bug", title:"Customers with no email",
  ctx:"Should list every customer who hasn't given an email address. Returns zero rows, though you know there are plenty.",
  sql:`SELECT customer_id, name
FROM customers
WHERE email = NULL;`,
  answer:`<ol><li><b>Nothing is ever equal to NULL</b>, not even NULL itself. The comparison returns UNKNOWN for every row, so nothing passes the filter. Use <b>WHERE email IS NULL</b>.</li></ol>`
},
{
  topic:"Logic", bugs:"1 bug", title:"Active users in two cities",
  ctx:"Meant to find active users in Dublin or Cork. It also returns inactive users from Cork.",
  sql:`SELECT *
FROM users
WHERE status = 'active'
  AND city = 'Dublin'
   OR city = 'Cork';`,
  answer:`<ol><li><b>AND binds tighter than OR.</b> The database reads it as (active AND Dublin) OR (Cork), so every Cork user comes back regardless of status. Wrap the OR in brackets: <b>status = 'active' AND (city = 'Dublin' OR city = 'Cork')</b>.</li></ol>`
},
{
  topic:"Aggregates", bugs:"1 bug", title:"Customers with more than 5 orders",
  ctx:"This one won't run at all.",
  sql:`SELECT customer_id, COUNT(*) AS total
FROM orders
WHERE COUNT(*) > 5
GROUP BY customer_id;`,
  answer:`<ol><li><b>You can't filter on an aggregate in WHERE.</b> WHERE runs before the rows are grouped, so COUNT(*) doesn't exist yet. Move the condition to <b>HAVING COUNT(*) &gt; 5</b>, after the GROUP BY.</li></ol>`
},
{
  topic:"Grouping", bugs:"1 bug", title:"Total spend per customer",
  ctx:"Also fails to run — or worse, on some databases it runs and returns a random name.",
  sql:`SELECT customer_id, name, SUM(amount) AS total
FROM orders
GROUP BY customer_id;`,
  answer:`<ol><li><b>name is neither grouped nor aggregated.</b> If there are three orders in a group, the database has three possible names and no rule for picking one. Add <b>name</b> to the GROUP BY.</li></ol>`
},
{
  topic:"Joins", bugs:"1 bug", title:"Every customer and their orders",
  ctx:"The LEFT JOIN is there on purpose — they want customers who have never ordered. Those customers don't appear.",
  sql:`SELECT c.name, o.order_id
FROM customers c
LEFT JOIN orders o ON o.customer_id = c.customer_id
WHERE o.status = 'shipped';`,
  answer:`<ol><li><b>The WHERE clause cancels out the LEFT JOIN.</b> Customers with no orders get NULL in o.status, and NULL fails the filter, so they're dropped — it behaves like an INNER JOIN. Move the condition into the join: <b>ON o.customer_id = c.customer_id AND o.status = 'shipped'</b>.</li></ol>`
},
{
  topic:"Syntax", bugs:"1 bug", title:"Missing column",
  ctx:"Three columns were expected. Only two come back, and one has a strange header.",
  sql:`SELECT first_name
       last_name,
       email
FROM customers;`,
  answer:`<ol><li><b>Missing comma after first_name.</b> SQL reads last_name as an alias, so the column comes back headed "last_name" but containing first names. No error — just quietly wrong data.</li></ol>`
},
{
  topic:"Counting", bugs:"1 bug", title:"How many customers",
  ctx:"Counting the customer table. The number is lower than the row count.",
  sql:`SELECT COUNT(phone_number) AS customer_count
FROM customers;`,
  answer:`<ol><li><b>COUNT(column) skips NULLs.</b> Any customer without a phone number isn't counted. Use <b>COUNT(*)</b> to count rows.</li></ol>`
},
{
  topic:"Dates", bugs:"1 bug", title:"July orders",
  ctx:"order_date is a timestamp — date and time. The total is a little low every month.",
  sql:`SELECT SUM(amount)
FROM orders
WHERE order_date BETWEEN '2026-07-01' AND '2026-07-31';`,
  answer:`<ol><li><b>The end date becomes midnight.</b> '2026-07-31' means 2026-07-31 00:00:00, so everything ordered during the last day is missed. Use <b>&gt;= '2026-07-01' AND &lt; '2026-08-01'</b>.</li></ol>`
},
{
  topic:"Duplicates", bugs:"1 bug", title:"Customers who ordered",
  ctx:"A list of customers who have placed at least one order. The list is much longer than expected and has repeats.",
  sql:`SELECT c.name
FROM customers c
JOIN orders o ON o.customer_id = c.customer_id;`,
  answer:`<ol><li><b>One row per order, not per customer.</b> A customer with 12 orders appears 12 times. Add <b>DISTINCT</b>, or use EXISTS if you only care whether they ordered.</li></ol>`
},
{
  topic:"Danger", bugs:"1 bug", title:"Fixing one record",
  ctx:"Someone ran this in production to correct a single customer's email.",
  sql:`UPDATE customers
SET email = 'new@example.com';`,
  answer:`<ol><li><b>No WHERE clause.</b> Every customer in the table now has the same email address. Worth asking what would have prevented it — a transaction they could roll back, running the SELECT first, or permissions that don't allow this at all.</li></ol>`
},
{
  topic:"End", bugs:"", title:"That's all ten",
  ctx:"Good closing question: which of these would a test suite have caught, and which would have shipped quietly?",
  sql:"-- Done.",
  answer:null
}
];

const TOKENS = new RegExp(
  "(--[^\\n]*)|('[^']*')|\\b(\\d+(?:\\.\\d+)?)\\b|" +
  "\\b(SELECT|FROM|WHERE|LEFT|RIGHT|INNER|FULL|OUTER|JOIN|ON|GROUP|ORDER|BY|HAVING|WITH|AS|AND|OR|NOT|IN|IS|NULL|DISTINCT|COUNT|SUM|AVG|MIN|MAX|CAST|COALESCE|CASE|WHEN|THEN|ELSE|END|OVER|PARTITION|UNION|ALL|BETWEEN|EXISTS|LIMIT|ASC|DESC|UPDATE|SET|DELETE|INSERT|INTO|VALUES)\\b",
  "gi");

function highlight(sql){
  const esc = sql.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc.replace(TOKENS, (m, c, s, n, k) => {
    if(c) return '<span class="c">'+c+'</span>';
    if(s) return '<span class="s">'+s+'</span>';
    if(n) return '<span class="n">'+n+'</span>';
    return '<span class="k">'+k+'</span>';
  });
}

const el = id => document.getElementById(id);
let i = 0;

const rail = el("rail");
SLIDES.forEach(() => {
  const p = document.createElement("div");
  p.className = "pip";
  rail.appendChild(p);
});
const count = document.createElement("span");
count.className = "count";
rail.appendChild(count);

function render(){
  const s = SLIDES[i];
  el("topic").textContent = s.topic;
  el("bugs").textContent = s.bugs || "";
  el("title").textContent = s.title;
  el("ctx").textContent = s.ctx;
  el("code").innerHTML = highlight(s.sql);

  const a = el("answer");
  a.hidden = true;
  a.innerHTML = s.answer || "";

  el("reveal").disabled = !s.answer;
  el("reveal").textContent = "Show answer";
  el("back").disabled = i === 0;
  el("next").disabled = i === SLIDES.length - 1;

  [...rail.querySelectorAll(".pip")].forEach((p,idx) => {
    p.className = "pip" + (idx === i ? " here" : idx < i ? " done" : "");
  });
  count.textContent = i + " / " + (SLIDES.length - 2);
  window.scrollTo(0,0);
}

function go(n){
  const t = Math.min(Math.max(n, 0), SLIDES.length - 1);
  if(t !== i){ i = t; render(); }
}
function toggleAnswer(){
  const a = el("answer");
  if(!SLIDES[i].answer) return;
  a.hidden = !a.hidden;
  el("reveal").textContent = a.hidden ? "Show answer" : "Hide answer";
}

el("next").onclick = () => go(i+1);
el("back").onclick = () => go(i-1);
el("reveal").onclick = toggleAnswer;

document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight"){ go(i+1); e.preventDefault(); }
  else if(e.key === "ArrowLeft"){ go(i-1); e.preventDefault(); }
  else if(e.key === " " && e.target.tagName !== "BUTTON"){ toggleAnswer(); e.preventDefault(); }
});

render();
</script>
</body>
</html>
